{{ define "main" }}
{{ if eq .Section "blog" }}
<div id="reading-progress" aria-hidden="true"></div>
<script>
(function() {
    var bar = document.getElementById('reading-progress');
    function update() {
        var scrollTop = window.scrollY || document.documentElement.scrollTop;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.width = docHeight > 0 ? (scrollTop / docHeight * 100) + '%' : '0%';
    }
    window.addEventListener('scroll', update, { passive: true });
    update();
})();
</script>
{{ end }}
<article>
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "blog" }}
    <div class="post-meta" style="margin-bottom: 2rem;">
        <time style="display: inline-flex; align-items: center;">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            {{ .Date.Format "Jan 2, 2006" }}
        </time>
        <span class="reading-time" style="display: inline-flex; align-items: center; margin-left: 1rem;">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            {{ .ReadingTime }} min read
        </span>
    </div>
    {{ end }}
    {{ .Content }}
</article>
{{ end }}
